<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timer</title>
<style>
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #2c3e50, #34495e);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
  }
  h1 {
    margin-bottom: 20px;
  }
  .timer-display {
    font-size: 48px;
    font-weight: bold;
    letter-spacing: 2px;
    background: rgba(255,255,255,0.1);
    padding: 20px 40px;
    border-radius: 12px;
    box-shadow: 0 0 15px rgba(0,0,0,0.5);
    margin-bottom: 20px;
  }
  .inputs {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }
  input {
    width: 60px;
    text-align: center;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    padding: 5px;
  }
  .buttons {
    display: flex;
    gap: 10px;
  }
  button {
    background: #2ecc71;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.2s;
  }
  button:hover { background: #27ae60; transform: scale(1.05); }
  button.stop { background: #e67e22; }
  button.stop:hover { background: #d35400; }
  button.reset { background: #e74c3c; }
  button.reset:hover { background: #c0392b; }
</style>
</head>
<body>

<h1>⏰ Timer</h1>

<div class="inputs">
  <input type="number" id="hours" placeholder="HH" min="0" max="99">
  <input type="number" id="minutes" placeholder="MM" min="0" max="59">
  <input type="number" id="seconds" placeholder="SS" min="0" max="59">
</div>

<div class="timer-display" id="display">00:00:00</div>

<div class="buttons">
  <button id="startBtn" onclick="startTimer()">Start</button>
  <button class="stop" onclick="pauseTimer()">Pause</button>
  <button class="reset" onclick="resetTimer()">Reset</button>
</div>

<audio id="bellSound">
  <source src="https://actions.google.com/sounds/v1/alarms/medium_bell_ring.ogg" type="audio/ogg">
</audio>

<script>
let totalTime = 0;
let timer;
let running = false;

function updateDisplay() {
  let h = Math.floor(totalTime / 3600);
  let m = Math.floor((totalTime % 3600) / 60);
  let s = totalTime % 60;
  document.getElementById("display").textContent =
    `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function playBell() {
  const sound = document.getElementById("bellSound");
  let count = 0;
  function ring() {
    if (count < 3) {
      sound.currentTime = 0;
      sound.play();
      count++;
      setTimeout(ring, 700); // 0.7 soniya tanaffus
    }
  }
  ring();
}

function startTimer() {
  if (running) return;
  if (totalTime === 0) {
    const h = parseInt(document.getElementById("hours").value) || 0;
    const m = parseInt(document.getElementById("minutes").value) || 0;
    const s = parseInt(document.getElementById("seconds").value) || 0;
    totalTime = h * 3600 + m * 60 + s;
    if (totalTime === 0) return alert("⏳ Vaqt kiriting!");
  }
  running = true;
  timer = setInterval(() => {
    if (totalTime <= 0) {
      clearInterval(timer);
      playBell();
      alert("⏰ Vaqt tugadi!");
      running = false;
      return;
    }
    totalTime--;
    updateDisplay();
  }, 1000);
}

function pauseTimer() {
  clearInterval(timer);
  running = false;
}

function resetTimer() {
  clearInterval(timer);
  running = false;
  totalTime = 0;
  document.getElementById("display").textContent = "00:00:00";
  document.getElementById("hours").value = "";
  document.getElementById("minutes").value = "";
  document.getElementById("seconds").value = "";
}
</script>

</body>
</html>
