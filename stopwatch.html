<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stopwatch</title>
<style>
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #1e1f2b, #2c3e50);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
  }
  h1 {
    margin-bottom: 20px;
  }
  .timer {
    font-size: 48px;
    font-weight: bold;
    letter-spacing: 2px;
    background: rgba(255,255,255,0.1);
    padding: 20px 40px;
    border-radius: 12px;
    box-shadow: 0 0 15px rgba(0,0,0,0.5);
  }
  .buttons {
    margin-top: 25px;
  }
  button {
    background: #2ecc71;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 10px 20px;
    font-size: 16px;
    margin: 0 8px;
    cursor: pointer;
    transition: 0.2s;
  }
  button:hover {
    background: #27ae60;
    transform: scale(1.05);
  }
  button.stop {
    background: #e67e22;
  }
  button.stop:hover {
    background: #d35400;
  }
  button.reset {
    background: #e74c3c;
  }
  button.reset:hover {
    background: #c0392b;
  }
</style>
</head>
<body>

<h1>⏱️ Stopwatch</h1>
<div class="timer" id="display">00:00:00.000</div>
<div class="buttons">
  <button id="startBtn" onclick="startStopwatch()">Start</button>
  <button class="stop" onclick="pauseStopwatch()">Pause</button>
  <button class="reset" onclick="resetStopwatch()">Reset</button>
</div>

<script>
let startTime = 0;
let elapsedTime = 0;
let timerInterval;
let running = false;

function updateDisplay(){
  const time = Date.now() - startTime + elapsedTime;
  const milliseconds = String(time % 1000).padStart(3, '0');
  const seconds = String(Math.floor(time / 1000) % 60).padStart(2, '0');
  const minutes = String(Math.floor(time / 60000) % 60).padStart(2, '0');
  const hours = String(Math.floor(time / 3600000)).padStart(2, '0');
  document.getElementById("display").textContent = `${hours}:${minutes}:${seconds}.${milliseconds}`;
}

function startStopwatch(){
  if(running) return;
  startTime = Date.now();
  timerInterval = setInterval(updateDisplay, 10);
  running = true;
}

function pauseStopwatch(){
  if(!running) return;
  clearInterval(timerInterval);
  elapsedTime += Date.now() - startTime;
  running = false;
}

function resetStopwatch(){
  clearInterval(timerInterval);
  running = false;
  elapsedTime = 0;
  document.getElementById("display").textContent = "00:00:00.000";
}
</script>

</body>
</html>
