<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator</title>
<style>
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #2c3e50, #4ca1af);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
  }
  h1 {
    margin-bottom: 20px;
  }
  .container {
    background: rgba(255,255,255,0.15);
    padding: 25px 40px;
    border-radius: 15px;
    box-shadow: 0 0 20px rgba(0,0,0,0.3);
    text-align: center;
  }
  input[type=number] {
    width: 80px;
    padding: 6px;
    border-radius: 8px;
    border: none;
    text-align: center;
    font-size: 16px;
  }
  button {
    background: #27ae60;
    border: none;
    color: white;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    margin-top: 15px;
    transition: 0.2s;
  }
  button:hover {
    background: #2ecc71;
    transform: scale(1.05);
  }
  .password-box {
    margin-top: 20px;
    font-size: 18px;
    background: rgba(255,255,255,0.1);
    padding: 10px 15px;
    border-radius: 10px;
    min-width: 200px;
    word-break: break-all;
  }
  label {
    display: block;
    margin-top: 10px;
  }
</style>
</head>
<body>

<h1>🔐 Parol Generator</h1>

<div class="container">
  <label>Parol uzunligi:
    <input type="number" id="length" min="4" max="64" value="12">
  </label>
  <label><input type="checkbox" id="lower" checked> Kichik harflar (a-z)</label>
  <label><input type="checkbox" id="upper" checked> Katta harflar (A-Z)</label>
  <label><input type="checkbox" id="numbers" checked> Raqamlar (0-9)</label>
  <label><input type="checkbox" id="symbols"> Belgilar (!@#$%^&*)</label>
  
  <button onclick="generatePassword()">Yarat</button>
  <div class="password-box" id="passwordBox">Parol bu yerda chiqadi</div>
  <button onclick="copyPassword()">📋 Nusxa olish</button>
</div>

<script>
function generatePassword() {
  const length = +document.getElementById('length').value;
  const lower = document.getElementById('lower').checked;
  const upper = document.getElementById('upper').checked;
  const numbers = document.getElementById('numbers').checked;
  const symbols = document.getElementById('symbols').checked;

  const lowerChars = "abcdefghijklmnopqrstuvwxyz";
  const upperChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  const numberChars = "0123456789";
  const symbolChars = "!@#$%^&*()_+-=[]{}|;:,.<>?";
  
  let charset = "";
  if (lower) charset += lowerChars;
  if (upper) charset += upperChars;
  if (numbers) charset += numberChars;
  if (symbols) charset += symbolChars;

  if (!charset) {
    alert("Hech bo‘lmasa bitta variantni tanlang!");
    return;
  }

  let password = "";
  for (let i = 0; i < length; i++) {
    password += charset.charAt(Math.floor(Math.random() * charset.length));
  }

  document.getElementById("passwordBox").textContent = password;
}

function copyPassword() {
  const password = document.getElementById("passwordBox").textContent;
  if (!password || password === "Parol bu yerda chiqadi") {
    alert("Avval parol yarating!");
    return;
  }
  navigator.clipboard.writeText(password);
  alert("Parol nusxa olindi ✅");
}
</script>

</body>
</html>
