<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz - Classic Tools</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #c9e6ff, #f0faff);
    margin: 0;
    padding: 0;
    text-align: center;
  }
  header {
    background: #0077cc;
    color: white;
    padding: 15px;
    font-size: 24px;
  }
  #langSelect {
    margin: 15px;
    padding: 8px;
    border-radius: 6px;
  }
  #quiz-container {
    max-width: 700px;
    margin: 20px auto;
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 0 10px rgba(0,0,0,0.2);
  }
  .question {
    font-weight: bold;
    margin-bottom: 10px;
  }
  .option {
    display: block;
    background: #f2f2f2;
    margin: 8px 0;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
  }
  .option:hover {
    background: #d0eaff;
  }
  #nextBtn, #startBtn {
    margin-top: 15px;
    padding: 10px 20px;
    background: #0077cc;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
  }
  #timer {
    font-weight: bold;
    color: #ff3333;
  }
</style>
</head>
<body>
  <header>🌍 Quiz - Classic Tools</header>

  <div>
    <label for="langSelect">Tilni tanlang:</label>

  </div>

    {q:"Какое животное — символ России?",a:["Медведь","Волк","Орел","Тигр"],correct:0},
    {q:"Сколько материков на Земле?",a:["5","6","7","8"],correct:2},
    {q:"Кто первый человек в космосе?",a:["Гагарин","Армстронг","Терешкова","Королев"],correct:0},
    {q:"Какой газ необходим для дыхания?",a:["Кислород","Углекислый","Азот","Водород"],correct:0},
    {q:"Какой город называют северной столицей России?",a:["Москва","Питер","Казань","Екатеринбург"],correct:1},
    {q:"Сколько дней в високосном году?",a:["364","365","366","367"],correct:2},
    // ... davom ettiraman
  ]
};

let currentLang = "uz";
let questions = [];
let index = 0;
let score = 0;
let timeLeft = 60;
let timer;

document.getElementById("startBtn").onclick = () => {
  currentLang = document.getElementById("langSelect").value;
  questions = [...quizData[currentLang]].sort(()=>Math.random()-0.5).slice(0,10);
  index = 0;
  score = 0;
  document.getElementById("quiz-container").style.display = "block";
  document.getElementById("startBtn").style.display = "none";
  loadQuestion();
  startTimer();
};

function startTimer(){
  timeLeft = 60;
  timer = setInterval(()=>{
    timeLeft--;
    document.getElementById("timer").innerText = `⏱️ ${timeLeft} soniya qoldi`;
    if(timeLeft<=0){
      clearInterval(timer);
      showResult();
    }
  },1000);
}

function loadQuestion(){
  const q = questions[index];
  const container = document.getElementById("question-container");
  container.innerHTML = `<div class='question'>${index+1}. ${q.q}</div>` +
    q.a.map((opt,i)=>`<div class='option' onclick='checkAnswer(${i})'>${opt}</div>`).join("");
}

function checkAnswer(selected){
  if(selected===questions[index].correct){ score++; }
  document.getElementById("nextBtn").style.display="block";
}

document.getElementById("nextBtn").onclick=()=>{
  index++;
  if(index<questions.length){loadQuestion(); document.getElementById("nextBtn").style.display="none";}
  else{showResult();}
};

function showResult(){
  clearInterval(timer);
  document.getElementById("question-container").innerHTML = `<h2>Natija: ${score}/${questions.length}</h2>`;
  document.getElementById("nextBtn").style.display="none";
}
</script>

function showResults() {
  const resultDiv = document.getElementById("result");
  const scoreText = document.getElementById("score");
  const detailsDiv = document.getElementById("details");

  let correctCount = 0;
  let wrongCount = 0;
  let detailsHTML = "";

  quizData.forEach((q, index) => {
    const userAnswer = userAnswers[index];
    if (userAnswer === q.correct) {
      correctCount++;
    } else {
      wrongCount++;
      detailsHTML += `
        <p class="wrong">
          <b>${index + 1}.</b> ${q.question}<br>
          ❌ Siz tanlagan: ${q.options[userAnswer] || "Hech narsa"}<br>
          ✅ To‘g‘ri javob: ${q.options[q.correct]}
        </p>
      `;
    }
  });

  scoreText.innerHTML = `✅ To‘g‘ri: <b>${correctCount}</b> ta<br>❌ Noto‘g‘ri: <b>${wrongCount}</b> ta`;
  detailsDiv.innerHTML = detailsHTML;
  document.getElementById("quiz").style.display = "none";
  resultDiv.style.display = "block";
}
